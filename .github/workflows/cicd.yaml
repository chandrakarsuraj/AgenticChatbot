
name: HamarBani CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirments.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest -v

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hamarbani:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hamarbani:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Check required app secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Add OPENAI_API_KEY as a GitHub Actions secret."
            exit 1
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hamarbani
          TAG: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,TAG,OPENAI_API_KEY,TAVILY_API_KEY
          script: |
            mkdir -p /opt/hamarbani/data
            umask 077
            printf 'OPENAI_API_KEY=%s\nTAVILY_API_KEY=%s\n' "$OPENAI_API_KEY" "$TAVILY_API_KEY" > /opt/hamarbani/app.env

            docker pull $IMAGE:$TAG

            docker stop hamarbani || true
            docker rm hamarbani || true

            mkdir -p /opt/hamarbani/data

            docker run -d \
              --name hamarbani \
              --restart unless-stopped \
              -p 8501:8501 \
              --env-file /opt/hamarbani/app.env \
              -v /opt/hamarbani/data:/data \
              $IMAGE:$TAG

            docker image prune -f
